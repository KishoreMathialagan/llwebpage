    <style>
      /* Critical: prevents any flash of un-styled content and powers the intro curtain. */
      html { background: #080909; }
      body { margin: 0; background: #080909; color: #F3F1E9; }
      #loader {
        position: fixed; inset: 0; z-index: 9999; background: #080909;
        display: flex; align-items: center; justify-content: center;
        transition: opacity .65s cubic-bezier(.16,1,.3,1), transform .65s cubic-bezier(.16,1,.3,1);
      }
      #loader.is-done { opacity: 0; transform: translateY(-1.5%); pointer-events: none; }
      .loader-inner { display: flex; align-items: center; gap: 14px; }
      .loader-word {
        font-family: 'Manrope', system-ui, sans-serif; font-weight: 600;
        font-size: clamp(20px, 2.2vw, 26px); letter-spacing: -.035em; color: #F3F1E9;
        opacity: 0; animation: loaderWord .8s .1s cubic-bezier(.16,1,.3,1) forwards;
      }
      .loader-orbit { width: 26px; height: 26px; opacity: 0; animation: loaderWord .8s .02s cubic-bezier(.16,1,.3,1) forwards; overflow: visible; }
      .loader-orbit ellipse { fill: none; stroke: #D6F36A; stroke-width: 1; }
      .loader-orbit circle { fill: #D6F36A; }
      .loader-orbit .o2 { stroke: rgba(243,241,233,.35); }
      .loader-line {
        position: absolute; left: 50%; bottom: 13vh; width: 120px; height: 1px;
        background: rgba(255,255,255,.14); overflow: hidden; transform: translateX(-50%);
      }
      .loader-line i {
        display: block; height: 100%; width: 40%; background: #D6F36A;
        animation: loaderSweep 1.15s cubic-bezier(.65,0,.35,1) infinite;
      }
      .loader-meta {
        position: absolute; left: 50%; transform: translateX(-50%); bottom: 9vh;
        font-family: 'Manrope', system-ui, sans-serif; font-size: 9px; letter-spacing: .22em;
        text-transform: uppercase; color: #6E716B; white-space: nowrap;
      }
      @keyframes loaderWord { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes loaderSweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(330%); } }
      @media (prefers-reduced-motion: reduce) {
        .loader-word, .loader-orbit { animation: none; opacity: 1; }
        .loader-line i { animation: none; width: 100%; }
        #loader { transition-duration: .01ms; }
      }
